x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  network_mode: host
  restart: unless-stopped
  # NOTE: every PYR client re-declares `volumes:` in full below. YAML merge (`<<`)
  # REPLACES a list, it does not deep-merge — so a shared volumes list here would
  # be silently overridden and never used. Keep per-client volumes per-service.

# Shared bits for the standalone host-networked apps (zevents, profvault, myjira,
# planmytrip, quapt_agents). Each brings its own Dockerfile + volumes, so only the
# safely-shareable keys live here.
x-host-rails8: &host-rails8
  network_mode: host
  restart: unless-stopped

x-common-env: &common-env
  RAILS_ENV: development
  DOCKER: "true"
  RULES_DISABLED: "false"
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: 3306
  DATABASE_USER: root
  DATABASE_PASSWORD: password
  MONGODB_USER: root
  MONGODB_PASSWORD: password
  MONGODB_AUTH_SOURCE: admin
  MONGODB_SERVER: 127.0.0.1:27017
  ELASTICSEARCH_URL: http://127.0.0.1:9200

x-command: &common-command /opt/pyr-docker/entrypoint.sh

services:
  # ==================== STAMPINUP (3003) ====================
  stampinup:
    <<: *common
    container_name: pyr-stampinup
    working_dir: /opt/pyr/clients/stampinup
    volumes:
      - /home/kalyan/platform/clients/stampinup/pyr:/opt/pyr
      - bundle_cache:/usr/local/bundle
      - ~/.ssh:/root/.ssh:ro
      - ./pyr_override_config.yml:/opt/.pyr/config.yml:ro
      - ./entrypoint.sh:/opt/pyr-docker/entrypoint.sh:ro
    environment:
      <<: *common-env
      CLIENT: stampinup
      PORT: "3003"
      DATABASE_NAME: pyr_stampinup_dev
      MONGODB_URI: mongodb://root:password@127.0.0.1:27017/pyr_stampinup_development?authSource=admin
      REDIS_URL: redis://127.0.0.1:6379/0
    command: *common-command

  # ==================== PARTYLITE (3005) ====================
  partylite:
    <<: *common
    container_name: pyr-partylite
    working_dir: /opt/pyr/clients/partylite
    volumes:
      - /home/kalyan/platform/clients/partylite/pyr:/opt/pyr
      - bundle_cache:/usr/local/bundle
      - ~/.ssh:/root/.ssh:ro
      - ./pyr_override_config.yml:/opt/.pyr/config.yml:ro
      - ./entrypoint.sh:/opt/pyr-docker/entrypoint.sh:ro
    environment:
      <<: *common-env
      CLIENT: partylite
      PORT: "3005"
      DATABASE_NAME: pyr_partylite_dev
      MONGODB_URI: mongodb://root:password@127.0.0.1:27017/pyr_partylite_development?authSource=admin
      REDIS_URL: redis://127.0.0.1:6379/1
    command: *common-command

  # ==================== AVON (3001) ====================
  avon:
    <<: *common
    container_name: pyr-avon
    working_dir: /opt/pyr/clients/avon
    volumes:
      - /home/kalyan/platform/clients/avon/pyr:/opt/pyr
      - bundle_cache:/usr/local/bundle
      - ~/.ssh:/root/.ssh:ro
      - ./pyr_override_config.yml:/opt/.pyr/config.yml:ro
      - ./entrypoint.sh:/opt/pyr-docker/entrypoint.sh:ro
    environment:
      <<: *common-env
      CLIENT: avon
      PORT: "3001"
      DATABASE_NAME: pyr_avon_dev
      MONGODB_URI: mongodb://root:password@127.0.0.1:27017/pyr_avon_development?authSource=admin
      REDIS_URL: redis://127.0.0.1:6379/2
    command: *common-command

  # ==================== NATURESSUNSHINE (3002) ====================
  naturessunshine:
    <<: *common
    container_name: pyr-naturessunshine
    working_dir: /opt/pyr/clients/naturessunshine
    volumes:
      - /home/kalyan/platform/clients/naturessunshine/pyr:/opt/pyr
      - bundle_cache:/usr/local/bundle
      - ~/.ssh:/root/.ssh:ro
      - ./pyr_override_config.yml:/opt/.pyr/config.yml:ro
      - ./entrypoint.sh:/opt/pyr-docker/entrypoint.sh:ro
    environment:
      <<: *common-env
      CLIENT: naturessunshine
      PORT: "3002"
      DATABASE_NAME: pyr_naturessunshine_dev
      MONGODB_URI: mongodb://root:password@127.0.0.1:27017/pyr_naturessunshine_development?authSource=admin
      REDIS_URL: redis://127.0.0.1:6379/3
    command: *common-command

  # ==================== MONAT (3004) ====================
  monat:
    <<: *common
    container_name: pyr-monat
    working_dir: /opt/pyr/clients/monat
    volumes:
      - /home/kalyan/platform/clients/monat/pyr:/opt/pyr
      - bundle_cache:/usr/local/bundle
      - ~/.ssh:/root/.ssh:ro
      - ./pyr_override_config.yml:/opt/.pyr/config.yml:ro
      - ./entrypoint.sh:/opt/pyr-docker/entrypoint.sh:ro
    environment:
      <<: *common-env
      CLIENT: monat
      PORT: "3004"
      DATABASE_NAME: pyr_monat_dev
      MONGODB_URI: mongodb://root:password@127.0.0.1:27017/pyr_monat_development?authSource=admin
      REDIS_URL: redis://127.0.0.1:6379/4
    command: *common-command

  # ==================== ZEVENTS (3007) ====================
  zevents:
    <<: *host-rails8
    build:
      context: .
      dockerfile: Dockerfile.zevents
    container_name: pyr-zevents
    working_dir: /opt/zevents
    volumes:
      - /home/kalyan/platform/clients/zevents:/opt/zevents
      - zevents_bundle_cache:/usr/local/bundle
      - zevents_node_modules:/opt/zevents/node_modules
      - ~/.ssh:/root/.ssh:ro
      - ./entrypoint-zevents.sh:/opt/pyr-docker/entrypoint-zevents.sh:ro
    environment:
      RAILS_ENV: development
      NODE_ENV: development
      PORT: "3007"
      WEBPACKER_DEV_SERVER_PORT: "3035"
      ZEVENTS_DB_HOST: 127.0.0.1
      ZEVENTS_DB_PORT: "3306"
      ZEVENTS_DB_USER: root
      ZEVENTS_DB_PASSWORD: password
      ZEVENTS_DB_NAME: zevents_development
      REDIS_URL: redis://127.0.0.1:6379/7
    command: /opt/pyr-docker/entrypoint-zevents.sh

  # ==================== PROFVAULT (1100) ====================
  profvault:
    <<: *host-rails8
    build:
      context: .
      dockerfile: Dockerfile.profvault
    container_name: pyr-profvault
    working_dir: /rails
    volumes:
      - /home/kalyan/platform/skchakri/prof_vault:/rails
      - profvault_bundle_cache:/usr/local/bundle
      - profvault_jobspy_venv:/rails/.jobspy-venv
      - ~/.ssh:/root/.ssh:ro
      - ./entrypoint-profvault.sh:/opt/pyr-docker/entrypoint-profvault.sh:ro
    environment:
      RAILS_ENV: development
      PORT: "1100"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: root
      DATABASE_PASSWORD: password
    command: /opt/pyr-docker/entrypoint-profvault.sh

  # ==================== MYJIRA (1200) ====================
  myjira:
    <<: *host-rails8
    build:
      context: .
      dockerfile: Dockerfile.myjira
    container_name: pyr-myjira
    working_dir: /rails
    volumes:
      - /home/kalyan/platform/skchakri/myjira:/rails
      - myjira_bundle_cache:/usr/local/bundle
      - ~/.ssh:/root/.ssh:ro
      - ./entrypoint-myjira.sh:/opt/pyr-docker/entrypoint-myjira.sh:ro
      # Host Claude Code CLI + auth, so PlaywrightRunnerJob can shell out
      # to `claude -p ...` for AI test-case interpretation. The bind mount
      # follows the symlink, so /usr/local/bin/claude becomes the real
      # versioned binary regardless of host version bumps.
      - /home/kalyan/.local/bin/claude:/usr/local/bin/claude:ro
      - /home/kalyan/.claude:/root/.claude
      # Persist Playwright's chromium download outside the container.
      - myjira_playwright_cache:/root/.cache/ms-playwright
    environment:
      RAILS_ENV: development
      PORT: "1200"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: root
      DATABASE_PASSWORD: password
      REDIS_URL: redis://127.0.0.1:6379/12
    command: /opt/pyr-docker/entrypoint-myjira.sh

  # ==================== PLAN MY TRIP (3010) ====================
  planmytrip:
    <<: *host-rails8
    build:
      context: .
      dockerfile: Dockerfile.plan_my_trip
    container_name: pyr-planmytrip
    working_dir: /rails
    volumes:
      - /home/kalyan/platform/skchakri/plan_my_trip:/rails
      - planmytrip_bundle_cache:/usr/local/bundle
      - ~/.ssh:/root/.ssh:ro
      - ./entrypoint-plan_my_trip.sh:/opt/pyr-docker/entrypoint-plan_my_trip.sh:ro
      # Host Claude Code CLI + auth, so services with provider=claude_cli
      # (DestinationBrief, RouteLandmarksBuilder, TripStructureBuilder,
      # ItineraryBuilder) bill against the operator's subscription instead
      # of ANTHROPIC_API_KEY. Symlink resolves at mount time so version
      # bumps on the host propagate without recreating the container.
      - /home/kalyan/.local/bin/claude:/usr/local/bin/claude:ro
      - /home/kalyan/.claude:/root/.claude
    environment:
      RAILS_ENV: development
      PORT: "3010"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: root
      DATABASE_PASSWORD: password
      REDIS_URL: redis://127.0.0.1:6379/13
      # API-key fallback for prompts configured with provider=anthropic.
      # Left blank → those services fall back to deterministic skeletons.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: /opt/pyr-docker/entrypoint-plan_my_trip.sh

  # ==================== QUAPT AGENTS (3030) ====================
  quapt_agents:
    <<: *host-rails8
    build:
      context: .
      dockerfile: Dockerfile.quapt_agents
    container_name: pyr-quapt-agents
    working_dir: /rails
    volumes:
      - /home/kalyan/platform/quapt/poc:/rails
      - quapt_agents_bundle_cache:/usr/local/bundle
      - ~/.ssh:/root/.ssh:ro
      - ./entrypoint-quapt_agents.sh:/opt/pyr-docker/entrypoint-quapt_agents.sh:ro
    environment:
      RAILS_ENV: development
      PORT: "3030"
      # Shared dev_datastack Postgres (read by config/database.yml).
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: root
      PGPASSWORD: password
      # Action Cable (live Turbo Streams) + Redis velocity counter.
      REDIS_URL: redis://127.0.0.1:6379/14
      # Powers the Claude agentic loop (anthropic gem). Inherited from host env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
    command: /opt/pyr-docker/entrypoint-quapt_agents.sh

  # ==================== BRANDREEL (3040) ====================
  # Next.js 16 + Remotion 4 video studio. Not a Rails app — runs `npm run dev`
  # with the source bind-mounted and node_modules in a named volume (container
  # builds its own arch-correct native binaries). Remotion renders MP4s in-
  # container via a headless Chromium baked by the entrypoint.
  brand_reel:
    <<: *host-rails8
    build:
      context: .
      dockerfile: Dockerfile.brand_reel
    container_name: pyr-brand-reel
    working_dir: /app
    volumes:
      - /home/kalyan/platform/skchakri/brand_reel:/app
      - brand_reel_node_modules:/app/node_modules
      - ~/.ssh:/root/.ssh:ro
      - ./entrypoint-brand_reel.sh:/opt/pyr-docker/entrypoint-brand_reel.sh:ro
    environment:
      NODE_ENV: development
      PORT: "3040"
      # Project JSON, rendered MP4s, uploads, and cached stock are written under
      # the bind-mounted repo so they persist on the host (defaults already point
      # at ./data, ./renders, ./public/uploads, ./cache/stock — set explicitly
      # for clarity).
      DATA_DIR: /app/data/projects
      RENDER_DIR: /app/renders
      UPLOAD_DIR: /app/public/uploads
      STOCK_CACHE_DIR: /app/cache/stock
      # Provider keys — env-gated capabilities. Missing keys leave the feature
      # disabled with a UI explainer rather than breaking (see registry.ts).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
    command: /opt/pyr-docker/entrypoint-brand_reel.sh

volumes:
  bundle_cache:
  quapt_agents_bundle_cache:
  zevents_bundle_cache:
  zevents_node_modules:
  profvault_bundle_cache:
  profvault_jobspy_venv:
  myjira_bundle_cache:
  myjira_playwright_cache:
  planmytrip_bundle_cache:
  brand_reel_node_modules:
